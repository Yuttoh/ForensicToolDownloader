; Copy this file to scripts.ini next to the executable.
; Each section creates one button in the Scripts tab.
; The app already includes the built-in "Habilitar servicos" script.
;
; Tokens:
;   {APP_DIR}   directory where the executable is running
;   {TOOLS_DIR} same as {APP_DIR}; tool folders are created here
;
; [OpenDownloadsFolder]
; Name=Open tool folder
; Description=Opens the directory where the downloader creates the tool folders.
; Command=explorer.exe "{TOOLS_DIR}"
; Elevated=0
;
; [ExampleBatch]
; Name=Run triage script
; Description=Runs a local batch file from the app directory.
; Command="{APP_DIR}\triage.bat"
; Elevated=0
